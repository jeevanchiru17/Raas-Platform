services:
  - type: web
    name: raas-backend-staging
    runtime: node
    region: singapore
    branch: beta
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    autoDeploy: false         # Triggered via deploy hook from GitHub Actions
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false           # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: CORS_ORIGIN
        value: https://raas-beta.vercel.app
