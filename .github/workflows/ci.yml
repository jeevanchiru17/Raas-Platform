name: ForaMetric CI

on:
  push:
    branches: [ develop, beta, main ]
  pull_request:
    branches: [ develop, beta, main ]

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Lint Code
        run: |
          cd frontend
          npm run lint || echo "Linting skipped or succeeded with warnings"

      - name: Check Types
        run: |
          cd frontend
          npm run type-check

      - name: Run Tests
        run: |
          cd frontend
          npm run test:run

      - name: Build Application
        run: |
          cd frontend
          npm run build

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Check Types
        run: |
          cd backend
          npm run type-check

      - name: Build Application
        run: |
          cd backend
          npm run build
